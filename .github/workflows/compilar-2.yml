# Compila Arlequin SaveHub 2.0 (interfaz web: pywebview + React) desde la
# carpeta ASH-2.0/ del repositorio.
#
# Cuándo se ejecuta:
#   - A mano: Actions -> "Compilar Arlequin SaveHub 2.0" -> Run workflow.
#   - Al subir una etiqueta v2.* (git tag v2.0.0-beta.1 && git push --tags):
#     además crea/actualiza la Release de esa etiqueta.
#
# Las versiones con guion (v2.0.0-beta.1) se publican como PRE-RELEASE: así
# no pasan a ser "latest" y el actualizador de la 1.1.x no las ofrece.

name: Compilar Arlequin SaveHub 2.0

on:
  workflow_dispatch:
  push:
    tags: ["v2.*"]

permissions:
  contents: write

jobs:
  compilar:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ASH-2.0
    env:
      HAY_SIGNPATH: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ASH-2.0/frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Compilar la interfaz (React)
        working-directory: ASH-2.0/frontend
        run: |
          npm ci
          npm run build

      - name: Instalar dependencias de Python
        run: python -m pip install --upgrade pip pyinstaller==6.22.3 pywebview pyyaml google-auth google-auth-oauthlib pystray pillow requests

      - name: Versión
        shell: pwsh
        run: |
          $version = (Select-String -Path ash_web.py -Pattern '^VERSION_WEB = "(.+)"').Matches[0].Groups[1].Value
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          $n = ($version -replace '-.*$', '' -replace '[^0-9.]', '').Split('.') + @('0','0','0','0') | Select-Object -First 4
          $t = ($n -join ', ')
          @"
          VSVersionInfo(
            ffi=FixedFileInfo(filevers=($t), prodvers=($t), mask=0x3f, flags=0x0, OS=0x40004, fileType=0x1, subtype=0x0, date=(0, 0)),
            kids=[
              StringFileInfo([StringTable('0C0A04B0', [
                StringStruct('CompanyName', 'aitor965'),
                StringStruct('FileDescription', 'Arlequin SaveHub'),
                StringStruct('FileVersion', '$version'),
                StringStruct('InternalName', 'Arlequin_SaveHub_2.0_beta'),
                StringStruct('LegalCopyright', '(C) aitor965 - GPL-3.0'),
                StringStruct('OriginalFilename', 'Arlequin_SaveHub_2.0_beta.exe'),
                StringStruct('ProductName', 'Arlequin SaveHub'),
                StringStruct('ProductVersion', '$version')])]),
              VarFileInfo([VarStruct('Translation', [0x0C0A, 1200])])
            ]
          )
          "@ | Set-Content version_info.txt -Encoding utf8
          Write-Host "Compilando ASH $version"

      - name: Compilar con PyInstaller
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name Arlequin_SaveHub_2.0_beta --icon icono.ico
          --add-data "web;web" --add-data "icono.ico;."
          --hidden-import pystray._win32 --collect-submodules webview
          --version-file version_info.txt ash_web.py

      - name: Subir el .exe como artefacto
        id: subir
        uses: actions/upload-artifact@v4
        with:
          name: Arlequin_SaveHub-${{ env.APP_VERSION }}
          path: ASH-2.0/dist/Arlequin_SaveHub_2.0_beta.exe
          if-no-files-found: error

      - name: Firmar con SignPath
        if: env.HAY_SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.subir.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: ASH-2.0/dist-firmado

      - name: Usar el .exe firmado
        if: env.HAY_SIGNPATH == 'true'
        shell: pwsh
        run: Copy-Item dist-firmado/Arlequin_SaveHub_2.0_beta.exe dist/Arlequin_SaveHub_2.0_beta.exe -Force

      - name: Huella SHA-256
        shell: pwsh
        run: |
          $h = (Get-FileHash dist/Arlequin_SaveHub_2.0_beta.exe -Algorithm SHA256).Hash.ToLower()
          Write-Host "SHA-256: $h"
          "### Arlequin_SaveHub_2.0_beta.exe $env:APP_VERSION`n`nSHA-256: ``$h``" >> $env:GITHUB_STEP_SUMMARY

      - name: Adjuntar a la Release (pre-release si la versión lleva guion)
        if: startsWith(github.ref, 'refs/tags/v2')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            if ($tag -match '-') { gh release create $tag --title "Arlequin SaveHub $tag" --notes "Versión $tag" --prerelease }
            else { gh release create $tag --title "Arlequin SaveHub $tag" --notes "Versión $tag" }
          }
          gh release upload $tag dist/Arlequin_SaveHub_2.0_beta.exe --clobber
